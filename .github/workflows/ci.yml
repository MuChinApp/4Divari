name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint, Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests (all modules)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Static analysis (detekt)
        run: ./gradlew --no-daemon detekt
        continue-on-error: false

      - name: Android Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble Debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results*
            **/build/reports/detekt**
          retention-days: 14
          if-no-files-found: ignore

  release-check:
    name: Release build gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Assemble Release (unsigned)
        run: ./gradlew --no-daemon assembleRelease
