name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint, Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests (all modules)
        id: tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee /tmp/test-log.txt

      - name: Static analysis (detekt)
        id: detekt
        if: success() || failure()
        run: |
          set -o pipefail
          ./gradlew --no-daemon detekt 2>&1 | tee /tmp/detekt-log.txt

      - name: Android Lint
        id: lint
        if: success() || failure()
        run: |
          set -o pipefail
          ./gradlew --no-daemon lintDebug 2>&1 | tee /tmp/lint-log.txt

      - name: Assemble Debug
        id: assemble
        if: success()
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee /tmp/assemble-log.txt

      - name: Capture failure log into workspace
        if: failure()
        run: |
          {
            echo "=== CI FAILURE CAPTURE $(date -u +%FT%TZ) ==="
            for f in /tmp/test-log.txt /tmp/detekt-log.txt /tmp/lint-log.txt /tmp/assemble-log.txt; do
              if [ -f "$f" ]; then
                echo ""
                echo "########## $f : FAILURE HEADERS ##########"
                grep -n -E "What went wrong|Script compilation|FAILURE:|Caused by:|^e: |error:|FAILED" "$f" | head -80 || true
                echo ""
                echo "########## $f (first 80 lines) ##########"
                head -n 80 "$f"
                echo ""
                echo "########## $f (last 80 lines) ##########"
                tail -n 80 "$f"
              fi
            done
          } > ci-last-error.log || true

      - name: Commit failure log (for sandbox visibility)
        if: failure()
        run: |
          if [ -f ci-last-error.log ]; then
            git config user.name "MuChinApp"
            git config user.email "311970907+MuChinApp@users.noreply.github.com"
            git add -f ci-last-error.log
            git commit -m "ci: capture failure log [skip ci]" || true
            git push origin HEAD || true
          fi

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            /tmp/test-log.txt
            /tmp/detekt-log.txt
            /tmp/lint-log.txt
            /tmp/assemble-log.txt
            ci-last-error.log
            **/build/reports/tests/**
            **/build/reports/lint-results*
          retention-days: 14
          if-no-files-found: ignore

  backend:
    name: Postgres migrations + RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chardivari
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply migrations and run smoke tests
        id: backend-tests
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5432/chardivari
        run: |
          set -o pipefail
          chmod +x supabase/tests/run_migrations.sh
          ./supabase/tests/run_migrations.sh 2>&1 | tee /tmp/backend-log.txt

      - name: Capture backend failure log
        if: failure()
        run: |
          {
            echo "=== BACKEND FAILURE CAPTURE $(date -u +%FT%TZ) =="
            if [ -f /tmp/backend-log.txt ]; then
              grep -n -E "ERROR|FATAL|psql:|RLS|SMOKE|exception" /tmp/backend-log.txt | head -80 || true
              echo "---- last 120 lines ----"
              tail -n 120 /tmp/backend-log.txt
            fi
          } > ci-backend-error.log || true

      - name: Commit backend failure log
        if: failure()
        run: |
          if [ -f ci-backend-error.log ]; then
            git config user.name "MuChinApp"
            git config user.email "311970907+MuChinApp@users.noreply.github.com"
            git add -f ci-backend-error.log
            git commit -m "ci: capture backend failure log [skip ci]" || true
            git push origin HEAD || true
          fi

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports-${{ github.sha }}
          path: |
            /tmp/backend-log.txt
            ci-backend-error.log
          retention-days: 14
          if-no-files-found: ignore

  release-check:
    name: Release build gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build-and-test, backend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Assemble Release (unsigned)
        run: ./gradlew --no-daemon assembleRelease
