# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache off until Hilt/KSP compatibility is verified in CI
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Breaks AGP 8.7 circular task graph: compileDebugKotlin -> bundleLibCompileToJarDebug -> compileDebugKotlin
# (friend-module artifact wiring; see kotlinlang.org/docs/gradle-configure-project)
kotlin.build.archivesTaskOutputAsFriendModule=false
